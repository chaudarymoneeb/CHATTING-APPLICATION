name: chat_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8

  # HTTP (needed for Cloudinary uploads)
  http: ^1.2.2

  # Voice messages
  record: ^7.1.1
  audioplayers: ^6.1.0

  # File system
  path_provider: ^2.1.6
  path: ^1.8.0

  # Emoji
  emoji_picker_flutter: ^4.5.4

  # Firebase
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.0
  cloud_firestore: ^6.9.0
  firebase_storage: ^13.5.0
  google_sign_in: ^7.2.0

  # Media
  # Keep aligned with zego_uikit_prebuilt_call's transitive dependency requirements.
  cached_network_image: ^3.4.1
  image_picker: ^1.2.3
  file_picker: ^10.3.8  # ✅ DOWNGRADED to match zego_uikit dependency

  # Connectivity
  # Keep aligned with zego_uikit_prebuilt_call's transitive dependency requirements.
  connectivity_plus: ^6.1.0

  # Local database
  sqflite: ^2.3.0

  # ============================================
  # 📞 AUDIO / VIDEO CALL (ZEGOCLOUD)
  # ============================================
  zego_uikit_prebuilt_call: ^4.24.4
  zego_uikit_signaling_plugin: ^2.8.21
  zego_uikit: ^2.29.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/